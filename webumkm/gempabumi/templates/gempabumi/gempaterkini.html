<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Gempa Terkini (M 5.0+) BMKG</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header */
        header {
            background: #11365a;
            color: #ffffff;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .header-title h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header-title p {
            font-size: 12px;
            color: #b0c4de;
            margin-top: 2px;
        }
        .header-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-action a {
            color: #dbeafe;
            text-decoration: none;
            font-size: 13px;
        }
        .header-action a:hover {
            text-decoration: underline;
        }
        .btn-reload {
            background: #ffffff;
            color: #11365a;
            border: 1px solid #ccc;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-reload:hover {
            background: #eaeaea;
        }

        /* Kontainer Utama */
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Daftar Gempa */
        .sidebar {
            width: 360px;
            min-width: 320px;
            background: #ffffff;
            border-right: 1px solid #d1d5db;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Card Tiap Gempa */
        .card-gempa {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            gap: 10px;
        }
        .card-gempa:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }
        .card-gempa.active {
            background-color: #e2e8f0;
            border-color: #475569;
        }

        /* Badge Magnitudo */
        .badge-mag {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        .info-gempa {
            flex: 1;
            min-width: 0;
        }
        .wilayah {
            font-size: 12.5px;
            font-weight: bold;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sub-info {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Map */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Kotak Legenda */
        .kotak-legenda {
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid #ccc;
        }
        .kotak-legenda b {
            display: block;
            margin-bottom: 4px;
        }
        .item-legenda {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }
        .titik-legenda {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .sub-legenda {
            margin-top: 5px;
            font-size: 11px;
            color: #666;
        }
    </style>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>15 Gempa Terkini (M 5.0+)</h1>
            <p>15 gempa M 5.0+ terakhir • diperbarui {{ waktu_update }}</p>
        </div>
        <div class="header-action">
            <a href="/">Kembali ke Menu</a>
            <button class="btn-reload" onclick="location.reload()">Muat ulang</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Daftar Gempa -->
        <div class="sidebar" id="sidebarList">
            {% for g in gempa_list %}
            <div class="card-gempa" id="card-{{ forloop.counter0 }}" onclick="fokusGempa({{ forloop.counter0 }})">
                <div class="badge-mag" style="background-color: {{ g.color }};">
                    {{ g.magnitude }}
                </div>
                <div class="info-gempa">
                    <div class="wilayah" title="{{ g.wilayah }}">{{ g.wilayah }}</div>
                    <div class="sub-info">{{ g.no }}. {{ g.tanggal }} {{ g.jam }} • {{ g.kedalaman }}</div>
                </div>
            </div>
            {% empty %}
            <div style="padding: 15px; color: #666; text-align: center;">Data gempa tidak tersedia.</div>
            {% endfor %}
        </div>

        <!-- Peta Leaflet -->
        <div id="map"></div>
    </div>

    <script>
        const gempaData = {{ gempa_json|safe }};

        // Peta fokus Indonesia
        const map = L.map("map", {
            center: [-2.5, 118.0],
            zoom: 5,
            minZoom: 4
        });

        // Basemap OSM
        const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Data gempa: <b>BMKG</b>'
        }).addTo(map);

        // Basemap Satelit
        const satelit = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "Tiles &copy; Esri | Data gempa: <b>BMKG</b>" }
        );

        const markers = [];

        // Buat marker lingkaran sesuai data
        gempaData.forEach((g, idx) => {
            if (!g.lat || !g.lng) return;

            // Ukuran radius berdasarkan magnitude
            const radius = Math.max(6, (g.magnitude_val - 4.5) * 8);

            const circle = L.circleMarker([g.lat, g.lng], {
                radius: radius,
                fillColor: g.color,
                color: "#ffffff",
                weight: 1.5,
                fillOpacity: 0.85
            });

            const popupContent = `
                <div style="font-size: 13px; line-height: 1.4;">
                    <b style="color: #11365a;">${g.wilayah}</b><br>
                    <b>Magnitudo:</b> ${g.magnitude}<br>
                    <b>Kedalaman:</b> ${g.kedalaman} (${g.kategori})<br>
                    <b>Waktu:</b> ${g.tanggal} ${g.jam}<br>
                    <b>Koordinat:</b> ${g.lintang}, ${g.bujur}<br>
                    <b>Potensi:</b> ${g.potensi}
                </div>
            `;
            circle.bindPopup(popupContent);

            circle.on("click", () => {
                tandaiCard(idx);
            });

            circle.addTo(map);
            markers[idx] = circle;
        });

        // Layer Control & Scale Control (300 km)
        L.control.layers(
            { "OpenStreetMap": osm, "Citra Satelit": satelit },
            null,
            { position: 'topright' }
        ).addTo(map);

        L.control.scale({ imperial: false, maxWidth: 200, position: 'bottomleft' }).addTo(map);

        // Legenda di pojok kanan bawah
        const legenda = L.control({ position: 'bottomright' });
        legenda.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'kotak-legenda');
            div.innerHTML = `
                <b>Kedalaman</b>
                <div class="item-legenda">
                    <span class="titik-legenda" style="background:#dc2626;"></span>
                    <span>Dangkal (&lt; 70 km)</span>
                </div>
                <div class="item-legenda">
                    <span class="titik-legenda" style="background:#ea580c;"></span>
                    <span>Menengah (70–300 km)</span>
                </div>
                <div class="item-legenda">
                    <span class="titik-legenda" style="background:#16a34a;"></span>
                    <span>Dalam (&gt; 300 km)</span>
                </div>
                <div class="sub-legenda">Ukuran lingkaran = magnitude</div>
            `;
            return div;
        };
        legenda.addTo(map);

        function fokusGempa(idx) {
            const g = gempaData[idx];
            if (!g || !markers[idx]) return;

            map.flyTo([g.lat, g.lng], 7, { duration: 1 });
            setTimeout(() => {
                markers[idx].openPopup();
            }, 1050);

            tandaiCard(idx);
        }

        function tandaiCard(idx) {
            document.querySelectorAll('.card-gempa').forEach(c => c.classList.remove('active'));
            const card = document.getElementById(`card-${idx}`);
            if (card) {
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
    </script>
</body>
</html>
